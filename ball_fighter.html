<script>
'use strict';
/* 數值與角色資料在 ball_fighter_data.js；這裡只放戰鬥邏輯 */
const resOf=c=>c._r||(c._r=Object.assign({},CFG.res,c.res)); // 角色資源 = 預設 + 角色覆蓋
const dashCost=f=>resOf(f.c).dashCost;
const frozen=f=>!!(G.ts&&G.ts.own!==f);   // 時停中：除了時停者以外全部凍結
const cdOf=(f,s)=>Math.max(0,s.cd*((f.rage&&f.c.rage)?f.c.rage.cdMul:1)-((f.zen&&f.c.zen)?f.c.zen.cdShave:0));   // 全集中呼吸：每次冷卻 −0.2 秒（不是 −20%）
//   // 你惹怒了我：新進入冷卻的技能時間減半
const inEnemyDom=f=>G.domains.some(d=>d.own!==f&&!d.clash&&Math.hypot(f.x-d.x,f.y-d.y)<d.r+CFG.r); // 站在敵方（未碰撞中）的領域內
const sureHit=f=>G.domains.some(d=>d.own===f&&!d.clash);   // 己方領域必中效果：領域碰撞期間失效
const later=(t,fn,own)=>G.sched.push({t,fn,own});   // own：這個延遲事件屬於誰（時停時，只有時停者的事件會繼續）                  // 延遲執行（多段攻擊用）
/* 領域成功展開 → 播放音效（sound = sound/ 底下的音檔；soundRate = 播放速度倍率，3 = 三倍速） */
let domSnd=null;
function stopDomainSound(){if(domSnd){domSnd.pause();domSnd=null}}
function domainShow(d){if(!d.sound||d.sshown)return;d.sshown=1;if(!Assets.unlocked||CFG.audio.muted)return;
 const r=Assets.rec(d.sound);if(!r||r.fail)return;stopDomainSound();const a=r.el.cloneNode();a.playbackRate=d.soundRate||1;
 a.volume=Math.max(0,Math.min(1,CFG.audio.master*CFG.audio.sfx));domSnd=a;a.play().catch(()=>{})}
/* ═══ 資源：圖片 / 音效 ═══
 * 檔案與主遊戲共用資料夾：圖片放 image/，音效與音樂放 sound/；缺檔不會報錯，會自動退回預設圖形 / 靜音。
 *  角色  CHARS.x.img        'image/xxx.png'  球體臉 + HUD 頭像 + 選角卡
 *  技能  sk.icon            技能按鈕圖示
 *        sk.sfx / hitSfx    施放音 / 命中音（mp3 ogg wav m4a）
 *        sk.sprite          飛行物貼圖（會跟著飛行方向旋轉）
 *        sk.zoneSprite      範圍技貼圖
 *  全域  SFX.*              通用音效（hit block dash win lose）   BGM  戰鬥音樂
 *  Assets.report() 可在主控台查看「已載入 / 缺檔」清單 */
const Assets={recs:{},unlocked:false,bgmEl:null,
 rec(path){if(!path)return null;let r=this.recs[path];if(r)return r;
  const isA=/\.(mp3|ogg|wav|m4a)$/i.test(path),el=isA?new Audio():new Image();r={el,ok:false,fail:false,audio:isA};this.recs[path]=r;
  if(isA){el.preload='auto';el.addEventListener('canplaythrough',()=>{r.ok=true},{once:true});el.addEventListener('error',()=>{r.fail=true});el.src=ASSET_BASE+path}
  else{el.onload=()=>{r.ok=true};el.onerror=()=>{r.fail=true};el.src=ASSET_BASE+path}
  return r},
 get(path){const r=this.rec(path);return r&&r.ok&&!r.audio?r.el:null},
 preload(){const L=[BGM,...Object.values(SFX)];for(const c of Object.values(CHARS)){L.push(c.img);for(const k in c.sk){const q=c.sk[k];L.push(q.icon,q.sfx,q.hitSfx,q.sprite,q.zoneSprite,q.domain&&q.domain.bg,q.domain&&q.domain.sound)}}L.forEach(x=>this.rec(x))},
 report(){const v=Object.entries(this.recs);return{ok:v.filter(e=>e[1].ok).map(e=>e[0]),missing:v.filter(e=>e[1].fail).map(e=>e[0])}},
 applyVol(){if(this.bgmEl)this.bgmEl.volume=CFG.audio.muted?0:CFG.audio.master*CFG.audio.bgm}};
function playSfx(path,vol){if(!path||!Assets.unlocked||CFG.audio.muted)return;const r=Assets.rec(path);if(!r||r.fail)return;
 const a=r.el.cloneNode();a.volume=Math.max(0,Math.min(1,CFG.audio.master*CFG.audio.sfx*(vol||1)));a.play().catch(()=>{})}
let slashAC=null;
function playSlashSfx(power=1){if(!Assets.unlocked||CFG.audio.muted)return;try{
  slashAC=slashAC||new (window.AudioContext||window.webkitAudioContext)();const ac=slashAC,now=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(520*power,now);o.frequency.exponentialRampToValueAtTime(90,now+.16);
  f.type='lowpass';f.frequency.setValueAtTime(2600,now);f.frequency.exponentialRampToValueAtTime(500,now+.18);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.min(.18,.075*power),now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+.2);
  o.connect(f).connect(g).connect(ac.destination);o.start(now);o.stop(now+.21);
 }catch(_){} }
function playBgm(){if(!Assets.unlocked)return;const r=Assets.rec(BGM);if(!r||r.fail)return;Assets.bgmEl=r.el;r.el.loop=true;Assets.applyVol();if(r.el.paused)r.el.play().catch(()=>{})}
function stopBgm(){const e=Assets.bgmEl;if(e){e.pause();e.currentTime=0}}
addEventListener('pointerdown',()=>{Assets.unlocked=true});addEventListener('keydown',()=>{Assets.unlocked=true}); // 瀏覽器規定：要有使用者操作後才能出聲
/* ═══ 3. 狀態 ═══ */
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let sel={p:'gojo',e:'sukuna'}, G={}, keys={}, mouse=null, joy={x:0,y:0}, view={s:1,ox:0,oy:0}, toast={t:0,s:''};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mk(id,x,side,isAI){const c=CHARS[id],dd=c.domDef,dm=dd&&!dd.useRes?(dd.max||1000):0;return{id,c,side,isAI,x,y:CFG.H/2,vx:0,vy:0,kx:0,ky:0,hp:c.hp,en:resOf(c).max,enMax:resOf(c).max,domGauge:dm,domMax:dm,domOverload:false,sts:[],mode:{},ch:{},cp:null,lg:null,enh:false,zen:false,rct:false,ext:false,dd:false,stand:false,sp:null,spAct:null,rage:false,hold:null,bfWin:0,bfReady:0,face:side?Math.PI:0,
 cd:Object.fromEntries(Object.keys(c.sk).map(k=>[k,0])),dashCd:0,act:null,stun:0,dashT:0,dx:0,dy:0,inv:0,blocking:false,mx:0,my:0,wins:0,ai:{t:0,sx:1,wantBlock:0}}}
function newRound(keep){const a=G.p?G.p.wins:0,b=G.e?G.e.wins:0;
 G.p=mk(sel.p,400,0,false);G.e=mk(sel.e,CFG.W-400,1,true);G.p.wins=a;G.e.wins=b;
 Object.assign(G,{projs:[],zones:[],orbs:[],domains:[],shields:[],sched:[],throws:[],ts:null,fx:[],t:CFG.time,ot:false,state:'fight',round:(G.round||0)+1});cam.snap=1;playBgm();layoutBtns();stopDomainSound();
 say('第 '+G.round+' 回合 開始！',1.4)}
function newMatch(){G={round:0};newRound();}
function say(s,t){toast={t:t||1,s}}
/* ═══ 特效：粒子 / 殘影 / 震動（只影響畫面，不影響判定） ═══ */
const FXCAP=520,MOTES=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),z:.25+Math.random()*.65}));
function spark(x,y,col,n,spd,life,w){for(let i=0;i<n&&G.fx.length<FXCAP;i++){const a=Math.random()*Math.PI*2,v=spd*(.4+Math.random()*.9);G.fx.push({k:'sp',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:life,m:life,col,w:w||3,dr:5})}}
function shrineStrikeFx(t,power=1){const a=Math.random()*Math.PI*2,r=CFG.r*(1.15+Math.random()*.8),col=['#ff2638','#ff5b32','#ff9b45','#ffe0a3'][Math.floor(Math.random()*4)];
 G.fx.push({k:'ds',x:t.x,y:t.y,a,r,t:.24,m:.24,col});G.fx.push({k:'ring',x:t.x,y:t.y,t:.16,m:.16,r:CFG.r*(1.1+power*.35),col:'#ff5b32'});spark(t.x,t.y,col,Math.round(5+power*3),300+power*130,.24,2.5+power*1.5)}
function suck(f,col,n,rad,life){for(let i=0;i<n&&G.fx.length<FXCAP;i++){const a=Math.random()*Math.PI*2,r=rad*(.7+Math.random()*.5);G.fx.push({k:'dt',x:f.x+Math.cos(a)*r,y:f.y+Math.sin(a)*r,vx:-Math.cos(a)*r/life,vy:-Math.sin(a)*r/life,t:life,m:life,col,r:3+Math.random()*3,sh:1})}}
function shake(a){cam.sh=Math.max(cam.sh||0,Math.min(a,16))}
function dashFx(f){if(G.fx.length>FXCAP-20)return;G.fx.push({k:'gh',x:f.x,y:f.y,t:.3,m:.3,col:f.c.color});
 for(let i=0;i<3;i++){const o=(Math.random()-.5)*CFG.r*2.2;G.fx.push({k:'sp',x:f.x-f.dy*o,y:f.y+f.dx*o,vx:-f.dx*1100,vy:-f.dy*1100,t:.22,m:.22,col:'#fff',w:2.5,dr:3})}}
function muzzle(f,s,a){if(!s.fx||s.noMuzzle)return;const px=f.x+Math.cos(a.ang)*(CFG.r+12),py=f.y+Math.sin(a.ang)*(CFG.r+12);
 G.fx.push({k:'ring',x:px,y:py,t:.28,m:.28,r:s.r*2.6,col:s.col});
 for(let i=0;i<10;i++){const aa=a.ang+(Math.random()-.5),v=500+Math.random()*600;G.fx.push({k:'sp',x:px,y:py,vx:Math.cos(aa)*v,vy:Math.sin(aa)*v,t:.25,m:.25,col:s.col,w:3,dr:4})}
 if(s.heavy){G.fx.push({k:'flash',t:.25,m:.25,col:s.col});shake(10)}}
function aura(f,dt){const h=f.hold,a=f.act,S=f.c.sk;let col=null,n=0,rad=0; // 蓄力吸附粒子 / 領域詠唱 / 反轉術式綠光
 if(h){const q=S[h.k];if(q.type!=='toggle'&&q.type!=='channel'&&h.t>=q.hold.start){const pr=Math.min(1,(h.t-q.hold.start)/(q.hold.full-q.hold.start));col=q.col||f.c.color;n=1+pr*2.5;rad=100+pr*80;
   if(!h.fd&&pr>=1){h.fd=1;G.fx.push({k:'ring',x:f.x,y:f.y,t:.35,m:.35,r:CFG.r*3.2,col:'#ffd77a'});spark(f.x,f.y,'#ffd77a',16,520,.4,3);if(f===G.p)pop(f,'蓄滿！','#ffd77a')}}}
 else if(a&&S[a.k].type==='domain'){col=S[a.k].domain.col||'#c9a3ff';n=3.5;rad=300}
 if(col){let c=Math.floor(n);if(Math.random()<n-c)c++;suck(f,col,c,rad,.32)}
 if(f.rct&&f.hp<f.c.hp&&G.fx.length<FXCAP&&Math.random()<.5)G.fx.push({k:'dt',x:f.x+(Math.random()-.5)*CFG.r*1.7,y:f.y+CFG.r*.5,vx:0,vy:-100,t:.6,m:.6,col:'#9ef09e',r:4,sh:1})}
/* ═══ 4. 戰鬥核心 ═══ */
function pop(t,s,col){G.fx.push({k:'txt',x:t.x,y:t.y-40,s,col:col||'#fff',t:.8,m:.8})}
function hit(t,d,fx,fy,kb,heavy,sk,att){
 if((t.inv>0&&!(G.ts&&t!==G.ts.own))||G.state!=='fight')return;d*=stat(t,'vuln',1);   // 時停中凍結的敵人，閃避無敵也擋不住
 if(att&&att.rage&&att.c.rage)d*=att.c.rage.dmgMul;if(att&&att.zen&&att.c.zen)d*=att.c.zen.dmgMul;   // 全集中呼吸：造成傷害 ×1.2（乘算）
 //   // 你惹怒了我：造成傷害 ×1.5
 if(G.ts&&t!==G.ts.own){G.ts.dmg+=d;G.ts.hits++;playSfx(SFX.hit);pop(t,Math.round(d),'#cfc4ff');spark(t.x,t.y,'#cfc4ff',8,420,.3,3);shake(3);return}   // 時停：敵人受到的傷害只記錄，時停結束才統一結算
 let km=1,col='#fff';const ig=!!(att&&att.ext); // 領域展延：無視格擋 / 無下限等減傷
 if(!ig&&t.blocking&&t.en>0&&t.c.infinity&&!stat(t,'burnout',0)){const I=t.c.infinity; // 無下限：受傷固定、被打會額外消耗資源
  t.en=Math.max(0,t.en-d*I.hitCost);d=I.dmg;km=0;col='#8ad';pop(t,'無下限','#8fd6ff')
 }else if(!ig&&t.blocking&&t.en>0){
  if(heavy){d*=CFG.block.heavyMul;t.stun=CFG.block.breakStun;t.blocking=false;pop(t,'破防！','#ffb44a');}
  else{d*=1-CFG.block.cut;km=CFG.block.kbMul;t.en=Math.max(0,t.en-d*CFG.block.hitCost*100/10);pop(t,'格擋','#8ad');col='#8ad'}
 }else{if(!t.hold)t.stun=Math.max(t.stun,CFG.hitStun);if(ig&&t.blocking)pop(t,'無視防禦','#ff7a5a')}
 playSfx(col==='#8ad'?SFX.block:(sk&&sk.hitSfx)||SFX.hit);t.hp-=d;if(t.stand&&t.c.stand){t.en=Math.max(0,t.en-d*t.c.stand.hitDrain);if(t.en<=0)standOff(t,true)}   // 替身：本體受傷會額外扣替身能量，歸零就強制關閉
 {const dm=G.domains.find(x=>x.own===t&&x.clash);if(dm)dm.integ-=d*CFG.clash.dmgScale} // 領域碰撞：受傷削減自身領域完整度
 if(sk&&col!=='#8ad'){if(sk.apply)for(const st of sk.apply)addStatus(t,st);if(typeof sk.onHit==='function')sk.onHit(t,sk)}const a=Math.atan2(t.y-fy,t.x-fx);t.kx+=Math.cos(a)*kb*km;t.ky+=Math.sin(a)*kb*km;

function layoutBtns(){skBtns.forEach(b=>{if(b.el.id!=='bA')b.el.remove()});skBtns=[];
 const S=G.p.c.sk,ks=Object.keys(S);$('bA').dataset.k=ks[0];$('bA').style.borderColor='';skBtns.push({el:$('bA'),k:ks[0],i:0});
 const sz=62,all=ks.slice(1).map((k,j)=>({k,i:j+1})),left=all.filter(it=>S[it.k].side==='L'),right=all.filter(it=>S[it.k].side!=='L');
 const mkSk=it=>{const el=document.createElement('div');el.className='b';el.dataset.k=it.k;if(S[it.k].ult)el.style.borderColor='#ff8a5a';$('stage').appendChild(el);bindSkillBtn(el);skBtns.push({el,k:it.k,i:it.i});return el};
 const mkMode=(kk,mj,mn,css)=>{const m=document.createElement('div');m.className='b';m.dataset.pk='m'+kk+mj;m.innerHTML='<small>'+S[kk].name+'</small>'+mn;m.style.cssText='font-size:11px;'+css;
  m.addEventListener('pointerdown',ev=>{ev.stopPropagation();G.p.mode[kk]=mj});$('stage').appendChild(m);skBtns.push({el:m,mini:1,k:kk,mj})};
 // 左側：搖桿正上方一排 —— side:'L' 的技能（反轉術式）＋ modesSide:'L' 的模式切換鈕（茈：詠唱／無限制）
 {let x=18;const LB='calc(174px + env(safe-area-inset-bottom,0px))',LX=v=>'calc('+v+'px + env(safe-area-inset-left,0px))';
  for(const it of left){const el=mkSk(it),d=60;el.style.width=el.style.height=d+'px';el.style.fontSize='12px';el.style.left=LX(x);el.style.bottom=LB;x+=d+8}
  for(const kk of ks)if(S[kk].modes&&S[kk].modesSide==='L')S[kk].modes.forEach((mn,mj)=>{mkMode(kk,mj,mn,'width:50px;height:50px;left:'+LX(x)+';bottom:calc(179px + env(safe-area-inset-bottom,0px))');x+=58})}
 // 右下：普攻在角落；閃避、格擋與其餘技能依序排成扇形，每圈依弧長決定放幾顆，間距固定、不會重疊
 const items=[{el:$('bD')},{el:$('bG')},...right];
 let idx=0,ring=0;
 while(idx<items.length){const R=125+ring*90,cap=Math.max(1,Math.floor(Math.PI/2*R/(sz+12))+1),n=Math.min(cap,items.length-idx);
  for(let j=0;j<n;j++,idx++){const it=items[idx],deg=n===1?225:180+90*j/(n-1),a=deg*Math.PI/180;let el=it.el;
   if(!el)el=mkSk(it);
   el.style.width=el.style.height=sz+'px';el.style.right=(64-R*Math.cos(a)-sz/2)+'px';el.style.bottom=(64-R*Math.sin(a)-sz/2)+'px';
   if(it.k&&S[it.k].modes&&S[it.k].modesSide!=='L'){const kk=it.k,R2=R+sz/2+34;S[kk].modes.forEach((mn,mj)=>{const a2=(deg+(mj?9:-9))*Math.PI/180; // 其他角色的模式切換小按鈕放在外圈
     mkMode(kk,mj,mn,'width:44px;height:44px;right:'+(64-R2*Math.cos(a2)-22)+'px;bottom:'+(64-R2*Math.sin(a2)-22)+'px')})}}
  ring++}applyPos()}

{const st=$('stage');let dr=null;const tg=e=>e.target.closest&&e.target.closest('#stage .b,#joy');
